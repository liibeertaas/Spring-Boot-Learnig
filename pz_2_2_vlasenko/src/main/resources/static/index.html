<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Report Service</title>
<style>
  :root {
    --bg-1: #0f172a;
    --bg-2: #4338ca;
    --card: rgba(255, 255, 255, 0.96);
    --ink: #1e1b2e;
    --muted: #6b7280;
    --accent: #4f46e5;
    --accent-2: #06b6d4;
    --pdf: #dc2626;
    --xlsx: #16a34a;
    --ring: rgba(79, 70, 229, 0.25);
    --danger-bg: #fef2f2;
    --danger-ink: #991b1b;
    --ok-bg: #f0fdf4;
    --ok-ink: #166534;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(6, 182, 212, .35), transparent 60%),
      radial-gradient(1000px 600px at 100% 10%, rgba(99, 102, 241, .35), transparent 55%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: var(--ink);
  }

  .card {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border-radius: 20px;
    padding: 32px 28px;
    box-shadow: 0 30px 60px -20px rgba(15, 23, 42, .55), 0 0 0 1px rgba(255,255,255,.06);
    backdrop-filter: blur(6px);
  }

  .icon {
    width: 52px; height: 52px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    margin-bottom: 16px;
    box-shadow: 0 8px 20px -6px var(--ring);
  }

  h1 {
    font-size: 22px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 24px;
  }

  .tabs {
    display: flex;
    background: #f1f2f7;
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 18px;
  }

  .tab {
    flex: 1;
    border: none;
    background: transparent;
    padding: 9px 0;
    border-radius: 9px;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    transition: background .15s, color .15s, box-shadow .15s;
  }

  .tab.active {
    background: #fff;
    color: var(--accent);
    box-shadow: 0 2px 8px rgba(15, 23, 42, .12);
  }

  .field-group { margin-bottom: 8px; }
  .field-group.hidden { display: none; }

  label {
    display: block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 6px;
  }

  input[type="month"], input[type="date"] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1.5px solid #e5e7eb;
    font-size: 14px;
    color: var(--ink);
    background: #fafafa;
    transition: border-color .15s, box-shadow .15s;
  }

  input[type="month"]:focus, input[type="date"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--ring);
    background: #fff;
  }

  .range-row {
    display: flex;
    gap: 12px;
  }
  .range-row > div { flex: 1; }

  .actions {
    display: flex;
    gap: 12px;
    margin-top: 22px;
  }

  button.doc-btn {
    flex: 1;
    border: none;
    border-radius: 12px;
    padding: 13px 10px;
    font-size: 14.5px;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
  }

  button.doc-btn:hover { transform: translateY(-2px); filter: brightness(1.06); }
  button.doc-btn:active { transform: translateY(0); }
  button.doc-btn:disabled { opacity: .6; cursor: progress; transform: none; }

  .btn-pdf  { background: linear-gradient(135deg, var(--pdf), #f97316); box-shadow: 0 10px 22px -10px rgba(220, 38, 38, .6); }
  .btn-xlsx { background: linear-gradient(135deg, var(--xlsx), #059669); box-shadow: 0 10px 22px -10px rgba(22, 163, 74, .6); }

  .status {
    margin-top: 18px;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    line-height: 1.4;
    display: none;
  }
  .status.show { display: block; }
  .status.error { background: var(--danger-bg); color: var(--danger-ink); }
  .status.ok { background: var(--ok-bg); color: var(--ok-ink); }

  footer {
    text-align: center;
    margin-top: 18px;
    font-size: 11.5px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📈</div>
    <h1>Звіт з продажів</h1>
    <p class="subtitle">Оберіть період і згенеруйте документ</p>

    <div class="tabs">
      <button type="button" class="tab active" data-mode="month">Місяць</button>
      <button type="button" class="tab" data-mode="range">Довільний період</button>
    </div>

    <div class="field-group" id="monthField">
      <label for="month">Місяць</label>
      <input type="month" id="month">
    </div>

    <div class="field-group hidden" id="rangeField">
      <div class="range-row">
        <div>
          <label for="from">Від</label>
          <input type="date" id="from">
        </div>
        <div>
          <label for="to">До</label>
          <input type="date" id="to">
        </div>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="doc-btn btn-pdf" id="pdfBtn">📄 PDF</button>
      <button type="button" class="doc-btn btn-xlsx" id="xlsxBtn">📊 Excel</button>
    </div>

    <div class="status" id="status"></div>

    <footer>sales-report-service &middot; /reports</footer>
  </div>

<script>
(() => {
  const tabs = document.querySelectorAll(".tab");
  const monthField = document.getElementById("monthField");
  const rangeField = document.getElementById("rangeField");
  const monthInput = document.getElementById("month");
  const fromInput = document.getElementById("from");
  const toInput = document.getElementById("to");
  const statusEl = document.getElementById("status");
  const pdfBtn = document.getElementById("pdfBtn");
  const xlsxBtn = document.getElementById("xlsxBtn");

  const now = new Date();
  monthInput.value = now.toISOString().slice(0, 7);

  let mode = "month";
  tabs.forEach(tab => tab.addEventListener("click", () => {
    tabs.forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    mode = tab.dataset.mode;
    monthField.classList.toggle("hidden", mode !== "month");
    rangeField.classList.toggle("hidden", mode !== "range");
    hideStatus();
  }));

  function hideStatus() {
    statusEl.className = "status";
    statusEl.textContent = "";
  }

  function showStatus(text, ok) {
    statusEl.className = "status show " + (ok ? "ok" : "error");
    statusEl.textContent = text;
  }

  function buildQuery() {
    if (mode === "month") {
      if (!monthInput.value) throw new Error("Оберіть місяць");
      return "month=" + encodeURIComponent(monthInput.value);
    }
    if (!fromInput.value || !toInput.value) throw new Error("Заповніть обидві дати періоду");
    return "from=" + encodeURIComponent(fromInput.value) + "&to=" + encodeURIComponent(toInput.value);
  }

  async function download(path, filenameHint, btn) {
    hideStatus();
    let query;
    try {
      query = buildQuery();
    } catch (e) {
      showStatus(e.message, false);
      return;
    }

    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = "⏳ Генерація...";

    try {
      const res = await fetch(`/reports/${path}?${query}`);
      if (!res.ok) {
        let message = "Помилка сервера (" + res.status + ")";
        try {
          const body = await res.json();
          if (body && body.message) message = body.message;
        } catch (_) { /* тіло не JSON */ }
        showStatus(message, false);
        return;
      }

      const blob = await res.blob();
      const disposition = res.headers.get("Content-Disposition") || "";
      const match = disposition.match(/filename="?([^"]+)"?/);
      const filename = match ? match[1] : filenameHint;

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);

      showStatus("Готово: " + filename, true);
    } catch (e) {
      showStatus("Не вдалося з'єднатися з сервером", false);
    } finally {
      btn.disabled = false;
      btn.textContent = originalText;
    }
  }

  pdfBtn.addEventListener("click", () => download("sales.pdf", "sales-report.pdf", pdfBtn));
  xlsxBtn.addEventListener("click", () => download("sales.xlsx", "sales-report.xlsx", xlsxBtn));
})();
</script>
</body>
</html>
