spring.application.name=sales-report-service

# Локальний .env (не в git) з реальними значеннями MAIL_USERNAME/MAIL_PASSWORD.
# "optional:" — застосунок не впаде, якщо файл відсутній.
spring.config.import=optional:file:.env[.properties]

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Список email-отримувачів звіту (керівники), через кому
report.recipients=vlasenkor274@gmail.com,andreypashko9@gmail.com

# Автоматично надсилати email (PDF + Excel) при кожному старті застосунку.
# У тестах (mvn test) вимкнено через @SpringBootTest(properties=...) у SalesReportServiceApplicationTests.
app.startup-mail.enabled=false

# Період для листа при старті. Якщо все три поля порожні — береться поточний місяць.
# Варіант 1 (цілий місяць):    app.startup-mail.month=2026-08
# Варіант 2 (довільний період): app.startup-mail.from=2026-06-01  і  app.startup-mail.to=2026-08-31
# Не можна заповнювати month разом із from/to — тільки щось одне.
#app.startup-mail.month=2026-08
app.startup-mail.from=2026-01-01
app.startup-mail.to=2027-01-01
